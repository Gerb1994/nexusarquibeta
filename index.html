<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <meta name="viewport" content="width=1280" />
    <meta name="theme-color" content="#8B5E3C" />
    <meta name="description" content="Sistema de gestão para escritório de arquitetura" />
    <link rel="apple-touch-icon" href="./app-icon.svg" />
    <title>NexusArqui</title>
    <style>
      /* Gantt Customization */
      ._3_ygE {
        background-color: hsl(var(--color-surface)) !important;
        color: hsl(var(--color-text-primary)) !important;
      } /* Gantt Background */
      ._29t6k {
        stroke: hsl(var(--color-border-color)) !important;
      } /* Grid lines */
      ._1n6sp {
        fill: hsl(var(--color-background)) !important;
      } /* Header background */
      ._2eZzQ {
        fill: hsl(var(--color-text-secondary)) !important;
      } /* Text color */
    </style>
  </head>
  <body class="bg-background text-text-primary transition-colors duration-300">
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module">
      if (window.location.protocol === 'file:') {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
          <div style="font-family: Arial, sans-serif; max-width: 720px; margin: 48px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
            <h1 style="margin: 0 0 12px;">Como executar este projeto</h1>
            <p style="margin: 0 0 10px;">Este app usa React + Vite e não pode ser aberto diretamente pelo arquivo <code>index.html</code>.</p>
            <p style="margin: 0 0 10px;">Use no terminal:</p>
            <pre style="background: #f6f8fa; padding: 12px; border-radius: 8px; overflow: auto;">npm install
npm run dev</pre>
            <p style="margin: 0;">Depois abra: <code>http://localhost:3000</code></p>
          </div>
        `;
        }
      } else {
        import('/src/frontend/index.tsx');
      }
    </script>
  </body>
</html>
